name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install commitizen
        run: pip install "commitizen==4.13.9"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # A merged release PR leaves pyproject.toml at a version that has no tag yet.
      # Tag the commit that set that version and publish it. Tags pushed with
      # GITHUB_TOKEN do not trigger other workflows, so publish.yml is dispatched.
      - name: Tag and publish the current version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cz version --project)"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists"
            exit 0
          fi
          commit="$(git log -n 1 --format=%H -S "version = \"${version}\"" -- pyproject.toml)"
          git tag -a "${tag}" -m "${tag}" "${commit}"
          git push origin "refs/tags/${tag}"
          gh workflow run publish.yml --ref "${tag}"
          echo "tagged=${tag}" >> "$GITHUB_OUTPUT"

      # main only accepts pull requests, so the version bump goes through a
      # release PR (Git flow release/vX.Y.Z) instead of being pushed to main.
      - name: Open or update the release pull request
        id: prepare
        if: steps.tag.outputs.tagged == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          next="$(cz bump --get-next 2> /dev/null)"
          code=$?
          set -e
          # 3: no commits since the last tag, 21: no commits that change the version
          if [ "$code" -eq 3 ] || [ "$code" -eq 21 ]; then
            echo "Nothing to release"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"

          current="$(cz version --project)"
          branch="release/v${next}"
          git checkout -B "${branch}"
          cz bump --yes
          git tag -d "v${next}"
          git push --force origin "${branch}"

          if [ -z "$(gh pr list --head "${branch}" --base main --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "${branch}" \
              --title "bump: version ${current} → ${next}" \
              --body "Release v${next}, prepared by \`cz bump\`. Merging tags v${next} and publishes it to PyPI."
          fi
          # Pull requests opened with GITHUB_TOKEN do not trigger CI, so run it explicitly.
          gh workflow run python-package.yml --ref "${branch}"
